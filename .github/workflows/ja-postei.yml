# Botão "Já postei" do site: abre uma issue "postado: NNN-nome".
# Este workflow apaga o vídeo, registra em postados.txt, atualiza o index.html e fecha a issue.
name: Já postei
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: ja-postei
jobs:
  apagar:
    # só o dono do repositório pode apagar vídeos
    if: startsWith(github.event.issue.title, 'postado:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apagar vídeo e atualizar site
        env:
          TITULO: ${{ github.event.issue.title }}
        run: |
          NOME=$(echo "${TITULO#postado:}" | tr -d '[:space:]')
          if ! echo "$NOME" | grep -Eq '^[0-9]{3}-[a-z0-9-]+$'; then echo "nome inválido: $NOME"; exit 1; fi
          git rm -q --ignore-unmatch "videos/$NOME.mp4" "videos/$NOME.jpg"
          grep -qx "$NOME" postados.txt 2>/dev/null || echo "$NOME" >> postados.txt
          python3 producao/scripts/gerar_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Postado: $NOME (vídeo removido)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Fechar issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }} -c "Vídeo apagado do site ✔"
